name: Build AIC School Messenger 2.0
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-messenger/**'
      - '.github/workflows/build-school-messenger.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android-messenger assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: aic-school-messenger-2.0-debug-apk
          path: android-messenger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error